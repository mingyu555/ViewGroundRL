# OmniDrive · GRPO + 관점항. 일반 GRPO 팔(rl_omni_q25vl7b_plain)과 데이터·보상·
# 스텝수가 동일하고 관점항만 켠다 — 교란 변수 없는 두 팔 비교.
#
# 왜 SFT 를 건너뛰나: OmniDrive 정답은 자유 서술이라 보상이 처음부터 연속이다.
# NuInstruct 는 이진 과제가 53% 라 학습 전 모델의 보상이 전부 0 이어서 그룹 내
# 분산이 없었지만(실측 frac_reward_zero_std 0.377), OmniDrive 보상은 검증에서
# 4후보 그룹 표준편차 중앙값 0.363, 분산 0 인 그룹 0/100 이었다.
#
# 이 실행의 목적: 학습 전 근거뷰 낙폭이 -0.00095 (사실상 0) 인 상태에서
# 일반 GRPO 만으로 관점 접지가 생기는지를 본다. 생기지 않으면 문제 정의
# ("일반 GRPO 로는 정확한 뷰를 보지 않는다") 가 OmniDrive 에서 성립하고,
# 관점항의 대조군이 된다.
#
# 보상 (vgrl/rewards.py):
#   omni_task   = 0.50 언어 F1 + 0.25 안전성 키워드 F1 + 0.35 좌표 F1
#                 (있는 항만 재정규화. 좌표 항이 없으면 관점 접지가 보상에 안 실린다)
#   omni_format = 길이비 + 3-gram 다양성 (한 단어 붕괴 / 무한 반복 방지)
model: /mnt/ssd4/mingyu/vgrl/base_qwen25vl7b
train_file: /mnt/ssd4/mingyu/vgrl/data/omni_rl_train.json
output_dir: /mnt/ssd4/mingyu/vgrl_saves/rl_omni_q25vl7b_view

attn_implementation: sdpa
keep_unusable_rows: true
max_pixels: 401408                 # 뷰 하나당

rewards: [omni_task, omni_format]
reward_weights: [1.0, 0.3]

view_grounding:
  enabled: true
  mode: kl_term
  sign: maximize_margin            # L = -coef*(kl1 - kl2)
  # k3 대신 k1 을 쓴다. k3(r - log r - 1)는 구조적으로 음수가 안 나와 "분포가
  # 흔들렸다"를 재고, "정답이 어려워졌다"를 재지 않는다. 실측: 학습 전 모델이
  # k3 로는 kl1/kl2 0.839/0.255 (3.3배 선택성) 인데 k1 로는 -0.030/-0.029 (없음).
  # 진단이 k1 이므로 손실도 k1 이어야 같은 축을 최적화한다.
  estimator: k1
  coef: 0.02
  grid_input: false                # 6뷰 개별 이미지
  num_views: 6
  num_views_to_mask: 1             # 진단과 동일하게 1장
  mask_mode: black
  margin_clip: 10.0                # k1 은 log p(근거뷰가림) 하한이 없어 상한이 필요
  kl_clip: null
  detach_control_branch: false
  # 일반 GRPO 팔에서 첫 50스텝이 응답 길이 정합(8.8 -> 173 -> 73 토큰)에 쓰였다.
  # 그 구간에 관점항을 걸면 아직 형식도 못 잡은 정책에 대조 압력이 들어간다.
  warmup_steps: 50
  seed: 0

deepspeed: configs/ds_zero3.json

# GPU 4장. 생성 배치 = per_device 4 x 4 GPU x steps_per_generation 2 = 32 = 8개씩 4그룹
# (NuInstruct RL 실행과 같은 구성). GPU 2장으로는 옵티마이저 몫이 42GB 로 올라
# GPU 0 여유 89GB 에서 OOM 났고, CPU 오프로드는 pin_memory() 가 죽었다.
num_generations: 8
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
steps_per_generation: 2
max_steps: 400
learning_rate: 1.0e-6
lr_scheduler_type: cosine
warmup_ratio: 0.03
beta: 0.02
epsilon: 0.2
loss_type: dr_grpo
max_completion_length: 256         # 정답 중앙값 66단어
temperature: 1.0
top_p: 1.0
bf16: true
gradient_checkpointing: true
ddp_timeout: 3600
logging_steps: 1
save_strategy: steps
save_steps: 100
save_total_limit: 1
dataloader_num_workers: 8
report_to: []
