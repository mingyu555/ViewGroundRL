# View-grounded GRPO on nuScenes *trajectory planning*.
#
# Why a separate config from rl_drivelm.yaml: DriveLM's "planning" category is
# object-level classification ("is <c4,CAM_FRONT,...> an object to consider?" ->
# "Yes."), not trajectory generation. The L2/collision benchmark scores trajectory
# generation, so the DriveLM RL stage never touched the task the benchmark
# measures — sft / rl_off / rl_viewground all landed at UniAD L2 1.01/1.00/1.00.
# Here the RL objective *is* the benchmarked task.
#
# Evidence views are derived from the 3D annotations rather than text tags
# (data_prep/nuscenes_evidence.py): the object that constrains the planned
# corridor, projected into the six cameras. 51% of frames can form a matched
# evidence/control split; the rest still train the policy without the view term.

model: /mnt/ssd1/vgrl/saves/sft_v2      # output of the SFT stage
train_file: /mnt/ssd1/vgrl/data/nusc_rl_v2.json
eval_file: /mnt/ssd1/vgrl/data/nusc_rl_v2_val.json
attn_implementation: sdpa          # flash-attn is not installed in vgrl:train
                                   # (its wheel build is optional and failed)
keep_unusable_rows: true                   # rows with no matched view split still
                                           # train the policy, just without the term

rewards: [physics_trajectory, trajectory_format]
reward_weights: [1.0, 0.3]

# ---------------------------------------------------------------- our method
view_grounding:
  enabled: true
  coef: 0.005               # weight on -(kl1 - kl2). Was 0.02, which let both KLs
                            # run away: they rose together from ~0.03 to ~169 over
                            # 250 steps, so the margin became noise (the KL-hacking
                            # mode PAPO documents).
  sign: maximize_margin     # maximize_margin | literal | kl1_only(=PAPO)
  num_views: 6
  num_views_to_mask: 1      # both branches blank the same count
  mask_mode: black
  answer_view_source: both
  margin_clip: 10.0
  kl_clip: 1.0              # the actual fix. margin_clip only bounded the
                            # *difference*, so kl1 and kl2 were free to inflate in
                            # lockstep; capping them individually removes the
                            # degenerate direction.
  detach_control_branch: false
  warmup_steps: 50          # let plain GRPO settle first
  seed: 0

# ---------------------------------------------------------------- GRPOConfig
output_dir: /mnt/ssd1/vgrl/saves/rl_nusc_vg
# Measured 100 s/step at num_generations=8 (GRPO rollouts + the term's three
# forward branches). 8 rollouts x 1500 steps would be 41 h per variant, so the
# group size is halved — advantage estimates get noisier but the run fits.
num_generations: 6
# Batch sizing counts *completions*, so keep it a multiple of num_generations.
# per_device=8 OOMed here at 94 GB/GPU: completions are 448 tokens (vs 256 on
# DriveLM) and the view term keeps three activation sets, not one. Halved, with
# grad-accum doubled to hold the effective batch.
# The SFT run left 100 GB/GPU unused at per_device=1 and ran at 13.8 s/step; the
# GPU sat at ~60% with dips to 0% waiting on the dataloader. Raising the batch and
# the worker count is where the throughput is.
per_device_train_batch_size: 6
gradient_accumulation_steps: 3
steps_per_generation: 2
dataloader_num_workers: 16
dataloader_persistent_workers: true
# Step budget follows the field: MindDriver's RFT is 1200 steps at batch 16,
# AutoDrive-R2 is 750 iterations. 250 x 8 prompts = 2000 prompts is smaller than
# both but enough to see whether vg/margin trends up.
max_steps: 500
learning_rate: 5.0e-7
lr_scheduler_type: cosine
warmup_ratio: 0.03
# Reference KL restored. It was 0.0 with the note "the perception term is the
# regulariser", but the `off` baseline disables that term and so ran with no anchor
# to the SFT policy at all — and it was the run that lost the most L2 (1.011 ->
# 1.031) and the most view locality (drop_evidence 0.037 -> 0.011). AutoDrive-R2
# and Drive-R1 both keep a KL term.
beta: 0.02
epsilon: 0.2
loss_type: dr_grpo
max_completion_length: 448   # SFT 타깃이 중앙 326 / p99 386 토큰. 320 은 69%를 잘라
                             # 궤적 보상을 0으로 만들었다 (스모크에서 clipped_ratio 0.69).
temperature: 1.0
top_p: 1.0
bf16: true
gradient_checkpointing: true       # kept on despite the headroom: the view
                                   # term holds three activation sets, not one
logging_steps: 1
save_steps: 500              # > max_steps: 중간 체크포인트를 만들지 않는다.
save_total_limit: 1
# 한 체크포인트가 21GB 다 (model 7GB + optimizer 15GB). save_total_limit 없이
# save_steps=200 으로 돌렸을 때 실행 하나가 49GB 를 먹어 공유 디스크를 채웠다.
# 이 실행들은 재개할 일이 없으니 최종 가중치만 남기면 7GB 로 끝난다.
report_to: []
max_pixels: 401408          # 6 views/sample: keep the visual token budget in check
