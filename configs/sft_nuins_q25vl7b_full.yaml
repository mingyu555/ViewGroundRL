# NuInstruct SFT — Qwen2.5-VL-7B 전체 파인튜닝, 현재 프레임 6뷰.
# VGGDrive 논문이 같은 벤치마크를 "six surround-view images from the current
# frame (C=6)" 으로 쓰므로 비디오를 쓰지 않는다.
# 비교 대상: VGGDrive Table 2 의 "Baseline" 행 (Qwen2.5-VL-7B SFT, Average* 31.32)
model: /mnt/ssd4/mingyu/vgrl/base_qwen25vl7b
train_file: /mnt/ssd4/mingyu/vgrl/data/nuins_sft_train.json
eval_file: /mnt/ssd4/mingyu/vgrl/data/nuins_sft_val.json
max_eval_rows: 200

attn_implementation: sdpa
max_pixels: 401408          # 뷰 하나당
freeze_vision_tower: true

output_dir: /mnt/ssd4/mingyu/vgrl_saves/sft_nuins_q25vl7b_full
num_train_epochs: 2
learning_rate: 1.0e-5
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true
max_length: 4096
logging_steps: 10
eval_strategy: "no"
save_strategy: "no"
report_to: []
dataloader_num_workers: 4
deepspeed: configs/ds_zero3.json
loss_type: nll
