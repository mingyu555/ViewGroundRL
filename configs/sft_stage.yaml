# Stage 1 — plain SFT on the teacher-built CoT set (DriveLM + nuScenes). No
# view-grounding term here by design: the model first has to learn the
# <think>/<answer> format and the <cID,CAMERA,x,y> reference convention before a
# perception-contrast signal means anything.
#
# Build the data with scripts/build_cot_sft.sh, which distils reasoning from a
# 72B teacher and keeps the ground truth as the <answer>.
#
# For the no-CoT ablation swap the dataset for drivelm_sft_plain,nuscenes_sft_plain.
#
# Run with real LLaMA-Factory (the copy vendored in this repo is gutted — 58 of its
# 64 source files are 0 bytes). See scripts/run_sft.sh.

model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
image_max_pixels: 401408
trust_remote_code: true
flash_attn: fa2
enable_liger_kernel: true

stage: sft
do_train: true
finetuning_type: full
freeze_vision_tower: true
freeze_multi_modal_projector: true
deepspeed: examples/deepspeed/ds_z2_config.json

dataset: cot_sft
template: qwen2_vl
cutoff_len: 16384
eval_dataset: cot_sft_val
per_device_eval_batch_size: 2
eval_strategy: steps
eval_steps: 500
max_samples: 10000000
overwrite_cache: true
preprocessing_num_workers: 16

output_dir: /mnt/ssd1/vgrl/saves/sft
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true
ddp_timeout: 180000000
